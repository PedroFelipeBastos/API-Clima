spring.application.name=API-Clima
server.port=8080

# API externa de clima (Open-Meteo)
clima.api.url=https://api.open-meteo.com/v1/forecast
# Geocodificacao: converte o nome da cidade em latitude/longitude
clima.api.geocoding-url=https://geocoding-api.open-meteo.com/v1/search

# Chave da API externa.
# O Open-Meteo NAO exige API Key, por isso o valor fica vazio.
# Se trocarem por WeatherAPI/OpenWeather, NAO escrevam a chave aqui:
# defina a variavel de ambiente CLIMA_API_KEY e injete no codigo com
# @Value("${clima.api.key}").
#   Linux/macOS: export CLIMA_API_KEY=sua_chave
#   Windows:     set CLIMA_API_KEY=sua_chave
clima.api.key=${CLIMA_API_KEY:}

# JSON identado, para facilitar a leitura no navegador
spring.jackson.serialization.indent-output=true
